name: Move sound files to public assets

on:
  workflow_dispatch:
  push:
    paths:
      - "*.mp3"

permissions:
  contents: write

jobs:
  move-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move MP3 files into public assets
        shell: bash
        run: |
          shopt -s nullglob
          files=(*.mp3)
          if [ ${#files[@]} -gt 0 ]; then
            mkdir -p client/public
            git mv -- "${files[@]}" client/public/
          fi

      - name: Commit published sound files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No MP3 files needed moving."
          else
            git commit -m "Move sound files into public assets"
            git push
          fi
